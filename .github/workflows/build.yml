# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build portable binaries for all supported platforms and attach them to
# GitHub Releases.
#
# Triggers:
#   • workflow_dispatch — "Run workflow" button in the Actions tab (beta builds)
#   • push v* tag       — fires automatically on version tags
#                         e.g. git tag v0.2.3 && git push --tags
#
# Artifacts produced per run (always downloadable for 30 days):
#   open-sstv-windows          → open-sstv-windows.zip
#   open-sstv-linux-x86_64     → open-sstv-linux-x86_64.zip
#   open-sstv-linux-x86_64-appimage → Open-SSTV-x86_64.AppImage
#   open-sstv-linux-arm64      → open-sstv-linux-arm64.zip
#   open-sstv-linux-arm64-appimage  → Open-SSTV-aarch64.AppImage
#   open-sstv-macos-arm64      → open-sstv-macos-arm64.zip
#
# macOS Intel is intentionally excluded — GitHub's ``macos-13`` runner
# pool has long queue times that stall releases, and Apple Silicon is
# the dominant modern Mac target.  Intel users on macOS can still
# install via ``pipx install open-sstv`` until a Universal2 build is
# wired up.
#
# On tag pushes all of the above are also attached to a public GitHub Release.
#
# macOS note: unsigned binaries will trigger Gatekeeper on first launch.
# Users should right-click → Open, or run:
#   xattr -d com.apple.quarantine open-sstv

name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned appimagetool — the audit flagged the previous "continuous"
  # channel pull as a hidden dependency on the AppImage org's CI staying
  # green at the exact moment we cut a tag.  Bump deliberately and
  # re-capture the sha256 sums below when you do.
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256_X86_64: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  APPIMAGETOOL_SHA256_AARCH64: "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
  # Pinned PortAudio source for the Linux builds.  sounddevice ships no
  # Linux wheel with PortAudio inside, so we compile it and bundle it
  # (AppImage/appimage.github.io#7563).  The official release tarball; the
  # sha256 matches Homebrew's independently pinned value for the same file.
  # Bump deliberately and re-capture the sum when you do.
  PORTAUDIO_TARBALL: "pa_stable_v190700_20210406.tgz"
  PORTAUDIO_SHA256: "47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def"

# Tag-driven release builds are cheap to start but slow to finish, so
# coalesce in-flight runs whenever a fresh tag (or manual dispatch)
# supersedes the previous one.  Distinct from test.yml's group so we
# never block release on test-cycle cancellation or vice versa.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-upload

# Needed so the ``release`` job's gh CLI can create the Release and upload
# the built zips / AppImages as assets on tag push.  Without ``contents:
# write`` the upload fails with HTTP 403 "Resource not accessible by
# integration" and no Release gets published.
permissions:
  contents: write

jobs:
  # Gate the release path on a green test matrix.  ``test.yml`` is a
  # reusable workflow (workflow_call trigger) that runs the non-gui,
  # non-integration pytest suite across the 3.11/3.12/3.13 × Linux/
  # Windows/macOS matrix.  Any cell failing here blocks the build job
  # below, so a broken commit can't ship via a tag push.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # let other platforms finish even if one fails
      matrix:
        include:

          - name: Windows x86_64
            runner: windows-latest
            artifact: open-sstv-windows

          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: open-sstv-linux-x86_64
            appimage_arch: x86_64

          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            artifact: open-sstv-linux-arm64
            appimage_arch: aarch64

          - name: macOS Apple Silicon
            runner: macos-14
            artifact: open-sstv-macos-arm64

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dependencies ────────────────────────────────────────────────────
      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pyinstaller-hooks-contrib

      # ── 3b. PortAudio for Linux ────────────────────────────────────────────
      # The Linux sounddevice wheel is pure Python and expects PortAudio from
      # the distro, so a plain build ships without it and the app dies at
      # launch with "PortAudio library not found" on any machine that lacks
      # a system copy (AppImage/appimage.github.io#7563).  test.yml has always
      # apt-installed libportaudio2, and that's why the tests never caught it.
      #
      # Built from source instead of apt, because Ubuntu's libportaudio2
      # links libjack.so.0, and libjack is on the AppImage excludelist: it
      # must match the host's JACK server, and it is absent on many desktops.
      # This build is ALSA-only, so its only non-libc dependency is
      # libasound.so.2, which every desktop Linux provides.  PipeWire and
      # PulseAudio users go through ALSA's default device.
      #
      # Installed to /usr/local so the hooks-contrib sounddevice hook finds it
      # with find_library() and collects it.  The spec fails the build if it
      # doesn't end up in the bundle.
      - name: Build PortAudio (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev
          wget -q "https://files.portaudio.com/archives/${PORTAUDIO_TARBALL}"
          ACTUAL=$(sha256sum "${PORTAUDIO_TARBALL}" | awk '{print $1}')
          if [ "${ACTUAL}" != "${PORTAUDIO_SHA256}" ]; then
            echo "PortAudio sha256 mismatch:"
            echo "  expected ${PORTAUDIO_SHA256}"
            echo "  actual   ${ACTUAL}"
            exit 1
          fi
          tar xzf "${PORTAUDIO_TARBALL}"
          cd portaudio
          ./configure --prefix=/usr/local --disable-static \
            --with-alsa --without-jack --without-oss --without-asihpi
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          python -c "import ctypes.util as u; p = u.find_library('portaudio'); print('find_library:', p); assert p, 'PortAudio not visible after install'"

      # ── 4. Build ───────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller open_sstv.spec

      # ── 5. Verify ──────────────────────────────────────────────────────────
      - name: Verify build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\open-sstv\open-sstv.exe"
          if (-not (Test-Path $exe)) { Write-Error "$exe not found"; exit 1 }
          Write-Host "OK: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

      - name: Verify build (Unix)
        if: runner.os != 'Windows'
        run: |
          # v0.3.21: macOS now ships as a .app bundle; the launcher
          # lives under Contents/MacOS/.  Linux still uses the onedir
          # folder layout.
          if [ "$RUNNER_OS" = "macOS" ]; then
            exe="dist/Open-SSTV.app/Contents/MacOS/open-sstv"
          else
            exe="dist/open-sstv/open-sstv"
          fi
          [ -f "$exe" ] || { echo "ERROR: $exe not found"; exit 1; }
          echo "OK: $exe ($(du -sh "$exe" | cut -f1))"

      # ── 6a. Package: Windows ───────────────────────────────────────────────
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\open-sstv -DestinationPath dist\${{ matrix.artifact }}.zip
          Write-Host "Archive: $([math]::Round((Get-Item dist\${{ matrix.artifact }}.zip).Length / 1MB, 1)) MB"

      # ── 6a½. Re-apply ad-hoc codesign (macOS only) ─────────────────────────
      # PyInstaller ad-hoc signs Mach-O binaries during the build, but two
      # failure modes still bite end users on Apple Silicon:
      #
      #   1. Intermediate build steps can leave dylib signatures in a
      #      state AMFI won't accept when the user unzips.  Re-signing
      #      every .dylib / .so / Python framework binary with a fresh
      #      ad-hoc signature fixes that.
      #
      #   2. PyInstaller's launcher bootloader ships with the hardened-
      #      runtime Mach-O flag baked in.  ``codesign --force --sign -``
      #      preserves that flag, so the ad-hoc-signed launcher enforces
      #      hardened-runtime library validation on its own dylibs at
      #      load time — and since the dylibs are ad-hoc-signed (team ID
      #      ``-``) the validation fails with::
      #
      #          code signature in <...> '/.../ _internal/Python' not
      #          valid for use in process: library load disallowed by
      #          system policy
      #
      #      Fix: re-sign the launcher with ``--options=runtime`` plus
      #      the ``packaging/macos-entitlements.plist`` entitlements that
      #      include ``com.apple.security.cs.disable-library-validation``.
      #      That keeps the bundle notarization-ready while telling AMFI
      #      it's OK to load the ad-hoc-signed children from the same
      #      bundle.
      #
      # Mach-O signatures live in the binary header (not xattrs) so they
      # survive the zip → download → unzip round-trip unchanged.
      - name: Re-sign bundle ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          # v0.3.21: target the new ``.app`` bundle instead of the
          # onedir folder.  The dylib re-sign sweep still runs first to
          # clear stale signatures inside the bundle (PyInstaller's
          # intermediate steps can leave dylibs in a state AMFI won't
          # accept), then a single bundle-level codesign --deep applies
          # the hardened-runtime + library-validation-disabled
          # entitlements to the whole tree at once.  --deep is what
          # lets one codesign call cover the launcher in
          # Contents/MacOS/ plus every Mach-O under Contents/
          # Frameworks/, instead of having to enumerate each path
          # explicitly.
          cd dist
          BUNDLE="Open-SSTV.app"
          # Strip old signatures from every Mach-O inside the bundle.
          find "$BUNDLE" -type f \( -name "*.dylib" -o -name "*.so" -o -name "Python" \) \
            -exec codesign --remove-signature {} \; 2>/dev/null || true
          find "$BUNDLE" -type f \( -name "*.dylib" -o -name "*.so" -o -name "Python" \) \
            -exec codesign --force --sign - {} \;
          # Bundle-level re-sign with --deep covers the launcher AND
          # re-applies entitlements so AMFI accepts the ad-hoc-signed
          # children at dlopen time.
          codesign --remove-signature "$BUNDLE" 2>/dev/null || true
          codesign --force --sign - --options=runtime --deep \
            --entitlements "$GITHUB_WORKSPACE/packaging/macos-entitlements.plist" \
            "$BUNDLE"
          echo "Ad-hoc signed: $(find "$BUNDLE" -type f \( -name '*.dylib' -o -name '*.so' \) | wc -l) dylibs/so + Python + launcher (bundle entitlements applied)"
          echo "--- bundle signature verification ---"
          codesign -dv --entitlements - "$BUNDLE" 2>&1 | head -20

      # ── 6b. Package: Linux zip (still onedir folder) ───────────────────────
      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ${{ matrix.artifact }}.zip open-sstv/
          echo "Archive: $(du -sh ${{ matrix.artifact }}.zip | cut -f1)"

      # ── 6b'. Package: macOS zip (.app bundle, v0.3.21+) ────────────────────
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # -y preserves symlinks inside the bundle (PySide6's
          # Qt frameworks have symlinks under Versions/Current).
          # Without -y zip would dereference them and bloat the
          # archive while breaking framework load semantics.
          zip -ry ${{ matrix.artifact }}.zip Open-SSTV.app
          echo "Archive: $(du -sh ${{ matrix.artifact }}.zip | cut -f1)"

      # ── 6c. Package: Linux AppImage ────────────────────────────────────────
      - name: Build AppImage (Linux only)
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          # Build AppDir from the PyInstaller onedir output
          mkdir -p AppDir
          cp -r dist/open-sstv/* AppDir/

          # AppRun launcher — must be at the root of AppDir
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="${SELF%/*}"
          exec "${HERE}/open-sstv" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # .desktop file (required by appimagetool)
          cat > AppDir/open-sstv.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Open-SSTV
          Exec=open-sstv
          Icon=open-sstv
          Type=Application
          Categories=HamRadio;Network;
          Comment=Open-source SSTV transceiver for amateur radio
          DESKTOP

          # Placeholder icon — appimagetool requires one.
          # Replace assets/icon.png in the repo to use a real icon.
          if [ -f assets/icon.png ]; then
            cp assets/icon.png AppDir/open-sstv.png
          else
            python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGB', (256, 256), '#1a3a5c')
          draw = ImageDraw.Draw(img)
          draw.ellipse([28, 28, 228, 228], outline='#4fc3f7', width=8)
          draw.text((88, 100), 'SSTV', fill='#4fc3f7')
          img.save('AppDir/open-sstv.png')
          "
          fi

          # Download a *pinned* appimagetool release and verify its
          # sha256 before running it.  See env block at the top of this
          # workflow for the version and per-arch sums.
          TOOL="appimagetool-${ARCH}.AppImage"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/${TOOL}"
          case "${ARCH}" in
            x86_64)  EXPECTED="${APPIMAGETOOL_SHA256_X86_64}" ;;
            aarch64) EXPECTED="${APPIMAGETOOL_SHA256_AARCH64}" ;;
            *) echo "Unknown arch ${ARCH} — no sha256 pinned"; exit 1 ;;
          esac
          ACTUAL=$(sha256sum "${TOOL}" | awk '{print $1}')
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "appimagetool sha256 mismatch for ${ARCH}:"
            echo "  expected ${EXPECTED}"
            echo "  actual   ${ACTUAL}"
            exit 1
          fi
          chmod +x "${TOOL}"

          # Build the AppImage
          ARCH="${ARCH}" ./"${TOOL}" AppDir "Open-SSTV-${ARCH}.AppImage"
          echo "AppImage: $(du -sh Open-SSTV-${ARCH}.AppImage | cut -f1)"

      # ── 6d. Smoke test on a host without PortAudio (Linux only) ────────────
      # The test the AppImage catalog runs, and the one that failed #7563:
      # start the app on a machine with no system PortAudio and check it's
      # still up. First we check that the bundle is self-contained in the
      # right way. Then we delete the PortAudio built above, because that
      # copy would otherwise hide a broken bundle exactly the way test.yml's
      # apt-installed copy hid this bug for months. Then we launch both
      # artifacts we ship.
      - name: Smoke test without system PortAudio (Linux only)
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail

          # 1. PortAudio is bundled, and it's the ALSA-only build.
          PA=$(find dist/open-sstv -maxdepth 2 -name 'libportaudio.so*' | head -n1)
          [ -n "${PA}" ] || { echo "ERROR: no libportaudio.so* in the bundle"; exit 1; }
          echo "bundled: ${PA}"
          readelf -d "${PA}" | grep NEEDED
          readelf -d "${PA}" | grep -q 'libasound\.so\.2' \
            || { echo "ERROR: bundled PortAudio has no ALSA backend"; exit 1; }
          if readelf -d "${PA}" | grep -q 'libjack'; then
            echo "ERROR: bundled PortAudio links libjack (AppImage excludelist)"; exit 1
          fi
          # The host must supply these two; the spec strips them.
          HOSTONLY=$(find dist/open-sstv \( -name 'libasound.so*' -o -name 'libjack.so*' \) -print)
          if [ -n "${HOSTONLY}" ]; then
            echo "ERROR: host-only libraries were bundled:"; echo "${HOSTONLY}"; exit 1
          fi

          # 2. Make the runner look like a desktop with no PortAudio.  Install
          #    the Qt runtime libraries every desktop has, which are also on the
          #    AppImage excludelist and so correctly come from the host.  This
          #    is test.yml's list minus libportaudio2, which is the whole point.
          #    Then remove the PortAudio built above.
          sudo apt-get install -y -q libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          sudo rm -f /usr/local/lib/libportaudio.*
          sudo ldconfig
          python -c "import ctypes.util as u, sys; p = u.find_library('portaudio'); sys.exit(f'system PortAudio still visible: {p}') if p else print('host has no PortAudio: OK')"

          # 3. Launch each shipped artifact headless.  Still running after 20 s
          #    means it got past startup: timeout exits 124 when it had to kill
          #    the app.  Anything else is a crash.
          smoke() {
            local label="$1"; shift
            set +e
            QT_QPA_PLATFORM=offscreen timeout 20 "$@" > smoke.log 2>&1
            local rc=$?
            set -e
            if [ "${rc}" -ne 124 ] \
               || grep -qE 'PortAudio library not found|Failed to execute script' smoke.log; then
              echo "ERROR: ${label} exited with rc=${rc} instead of staying up"
              cat smoke.log
              exit 1
            fi
            echo "OK: ${label} stayed up for 20 s with no system PortAudio"
          }
          smoke "onedir (zip contents)" dist/open-sstv/open-sstv
          smoke "AppImage" "./Open-SSTV-${ARCH}.AppImage" --appimage-extract-and-run

      # ── 7. Upload Actions artifacts (always available for 30 days) ──────────
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          retention-days: 30

      - name: Upload AppImage artifact (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-appimage
          path: Open-SSTV-*.AppImage
          retention-days: 30

      # NOTE: assets are NOT attached to the GitHub Release here.  See the
      # dedicated ``release`` job below — a single writer attaches every
      # platform's asset in one shot.

  # ── Publish ────────────────────────────────────────────────────────────────
  # One release job, not four.  The previous design had every matrix job call
  # softprops/action-gh-release@v2 to attach its own asset, so all four raced
  # to create/update the same Release concurrently.  On the Linux runners that
  # surfaced as a spurious "Requires authentication" (anonymous read succeeded,
  # the authenticated write did not) and left both Linux zips + both AppImages
  # off the v0.3.23 Release while Windows/macOS attached fine.  A single job
  # that downloads all artifacts and attaches them via the gh CLI removes the
  # concurrency entirely and uses the GITHUB_TOKEN auth path that the matrix
  # jobs proved works (Windows/macOS).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      # Pulls every artifact this run produced into ./artifacts/<name>/…
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach all assets to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # One zip per platform + the two Linux AppImages.
          mapfile -t assets < <(find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no build artifacts found to attach"; exit 1
          fi
          echo "Attaching ${#assets[@]} assets:"; printf '  %s\n' "${assets[@]}"
          # Create the Release on first publish; reuse it on a re-run.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          fi
          # --clobber so a re-run overwrites a partially-attached asset.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            --clobber "${assets[@]}"
