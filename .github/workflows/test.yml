# SPDX-License-Identifier: GPL-3.0-or-later
#
# Run pytest across every supported Python × OS combination.
#
# Triggers:
#   push                — every commit on any branch
#   pull_request        — every PR (catches branch-internal breakage)
#   workflow_dispatch   — manual "Run workflow" button in the Actions tab
#   workflow_call       — invoked from build.yml so tag-driven releases
#                          gate on a green matrix before building artifacts
#
# Markers excluded for now:
#   gui          — needs a Qt display.  Adding Xvfb on Linux is a follow-up.
#   integration  — needs external services (a live rigctld).  Nightly-only
#                   in a later pass.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel any in-flight test run for the same ref when a fresh commit
# lands; saves CI minutes during fast iteration.  Tag pushes use a
# distinct group key so the release path can't be cancelled by a
# follow-up push.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Linux system deps:
      #   * libportaudio2 / libsndfile1 — sounddevice and soundfile ship
      #     thin ctypes shims on Linux and dlopen the system libraries.
      #   * libegl1 / libxkbcommon0 / libdbus-1-3 / libfontconfig1 —
      #     pytest-qt's pytest_configure imports PySide6.QtGui at session
      #     start (even with all GUI tests deselected), and the PySide6
      #     wheel dlopens these system libs at import time.  Without them
      #     pytest aborts with "libEGL.so.1: cannot open shared object
      #     file" before any test collection.  macOS and Windows wheels
      #     carry the Qt runtime bundled so the same step is unnecessary
      #     there.  The set installed here is the import-time minimum;
      #     adding Xvfb-backed GUI tests will need more (libxcb-cursor0,
      #     libxkbcommon-x11-0, etc.) and is tracked as a follow-up.
      - name: Install audio + Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            libsndfile1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install project + dev/flac extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,flac]"

      - name: Lint (ruff, curated selection)
        # Gates on the categories already clean across the tree:
        #   I    — isort import ordering
        #   F    — pyflakes (unused imports, undefined names, unused vars)
        #   UP   — pyupgrade (modern typing, walrus, etc.)
        #   W    — pycodestyle warnings
        # Other categories (E, B, SIM) still have hand-fix outstanding from
        # the v0.3.15 audit follow-ups; widening the selection is its own
        # PR once the manual cleanup lands.  Running on src AND tests
        # because the gate is meaningful even where there's no shipping
        # code surface.
        run: ruff check src tests --select=I,F,UP,W

      - name: Run tests
        # QT_QPA_PLATFORM=offscreen tells Qt to use its software framebuffer
        # platform instead of trying to open an X11/Wayland display.  At
        # least one non-gui-marked test transitively requests pytest-qt's
        # ``qapp`` fixture (likely via ``qtbot``), which instantiates a
        # QApplication during setup.  On macOS Cocoa allows that headless;
        # on Linux X11/Wayland it SIGABRTs (exit 134) at fixture setup
        # without a display.  ``offscreen`` is built into Qt itself, needs
        # no extra apt package, and works identically on Linux, macOS,
        # and Windows so we set it globally for the matrix rather than
        # per-OS.  Removing the env var is part of the GUI-marker follow-up
        # PR when we wire up real Xvfb on Linux.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not gui and not integration" --maxfail=5 -q
